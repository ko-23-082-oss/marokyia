<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой облачный проект</title>

    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding: 50px;
            background-color: #f4f4f9;
        }

        .form-container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4b40b0;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #3a3390;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h3>Отправить заявку</h3>
        <form id="feedbackForm">
            <input type="text" id="userName" placeholder="Ваше имя" required>
            <input type="email" id="userEmail" placeholder="Ваш Email" required>
            <button type="submit">Отправить в облако</button>
        </form>
    </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { 
    getFirestore, 
    collection, 
    addDoc,
    serverTimestamp 
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

// Конфигурация Firebase
const firebaseConfig = {
    apiKey: "ТВОЙ_API_KEY",
    authDomain: "marokuia.firebaseapp.com",
    projectId: "marokuia",
    storageBucket: "marokuia.appspot.com",
    messagingSenderId: "202954413932",
    appId: "1:202954413932:web:0d6f7a09111edb09ecc549"
};

// Инициализация
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Обработка отправки формы
const form = document.getElementById("feedbackForm");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const nameInput = document.getElementById("userName").value.trim();
    const emailInput = document.getElementById("userEmail").value.trim();

    if (!nameInput || !emailInput) {
        alert("Заполните все поля!");
        return;
    }

    try {
        await addDoc(collection(db, "requests"), {
            name: nameInput,
            email: emailInput,
            timestamp: serverTimestamp()
        });

        alert("Готово! Данные сохранены в Firebase.");
        form.reset();

    } catch (error) {
        console.error("Ошибка записи:", error);
        alert("Ошибка при отправке. Проверь консоль.");
    }
});
</script>

</body>
</html>
