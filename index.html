<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>marokyia</title>
<style>
body { font-family: 'Inter', sans-serif; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
.container { width: 100%; max-width: 500px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom:20px; }
input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
button { background: #007bff; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-weight: 600; cursor: pointer; margin-top:5px;}
button:disabled { background: #999; cursor: not-allowed; }
.post { background: #fff; border: 1px solid #eaeaea; padding: 15px; margin-top: 15px; border-radius: 8px; width: 100%; max-width: 500px; }
.like-btn { cursor: pointer; border: none; background: #f8f9fa; padding: 5px 12px; border-radius: 20px; }
.time { font-size: 11px; color: #999; float: right; }
.hidden { display:none; }
.auth-info { font-size:13px; margin-bottom:10px; color:#444; }
</style>
</head>
<body>

<div class="container">
<h3>Авторизация</h3>
<div class="auth-info" id="userInfo">Вы не авторизованы</div>
<img id="userAvatar" class="hidden" style="width:50px;height:50px;border-radius:50%;margin-top:10px;">
<button id="loginBtn">Войти через Google</button>
<button id="logoutBtn" class="hidden">Выйти</button>
</div>

<div class="container hidden" id="mainForm">
<h3>Панель управления данными</h3>
<input type="text" id="name" placeholder="Имя профиля">
<input type="email" id="email" placeholder="Рабочий Email">
<button id="mainBtn">Опубликовать</button>
</div>

<div id="feed" style="width:100%; max-width:500px;"></div>

<div class="container hidden" id="reviewForm">
<h3>Оставить отзыв</h3>
<input type="text" id="reviewName" placeholder="Ваше имя">
<textarea id="reviewText" placeholder="Ваш отзыв"></textarea>
<button id="reviewBtn">Отправить отзыв</button>
</div>

<div id="reviewsFeed" style="width:100%; max-width:500px;"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {
getFirestore, collection, addDoc, query, orderBy, onSnapshot,
serverTimestamp, updateDoc, doc, increment
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

import {
getAuth, signInWithPopup, GoogleAuthProvider,
onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC4DKSosWcPardP2_Yo6jqVyJvt4vE8LJA",
  authDomain: "marokuia.firebaseapp.com",
  projectId: "marokuia",
  storageBucket: "marokuia.firebasestorage.app",
  messagingSenderId: "202954413932",
  appId: "1:202954413932:web:0d6f7a09111edb09ecc549",
  measurementId: "G-5NDDW98698"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

/* ======================
   АВТОРИЗАЦИЯ
====================== */

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const userInfo = document.getElementById("userInfo");
const userAvatar = document.getElementById("userAvatar");
const mainForm = document.getElementById("mainForm");
const reviewForm = document.getElementById("reviewForm");

loginBtn.onclick = async () => {
  try {
    await signInWithPopup(auth, provider);
  } catch (error) {
    if (error.code === "auth/popup-closed-by-user") {
      console.log("Пользователь закрыл окно авторизации");
    } else {
      console.error("Ошибка авторизации:", error);
      alert("Ошибка входа. Проверьте настройки Firebase.");
    }
  }
};

logoutBtn.onclick = async () => {
  await signOut(auth);
};

// ВОТ ЗДЕСЬ БЫЛА ОШИБКА. ТЕПЕРЬ ТУТ ЧИСТЫЙ БЛОК.
onAuthStateChanged(auth, (user) => {
  if (user) {
    // Если пользователь вошел
    userInfo.textContent = "Вы вошли как: " + user.displayName;

    if (user.photoURL) {
      userAvatar.src = user.photoURL;
      userAvatar.classList.remove("hidden");
    }

    loginBtn.classList.add("hidden");
    logoutBtn.classList.remove("hidden");
    mainForm.classList.remove("hidden");
    reviewForm.classList.remove("hidden");
  } else {
    // Если пользователь не вошел
    userInfo.textContent = "Вы не авторизованы";

    userAvatar.classList.add("hidden");
    userAvatar.src = "";

    loginBtn.classList.remove("hidden");
    logoutBtn.classList.add("hidden");
    mainForm.classList.add("hidden");
    reviewForm.classList.add("hidden");
  }
});

/* ======================
   ОСНОВНЫЕ ЗАПИСИ
====================== */

window.processLike = async (id) => {
  const docRef = doc(db, "requests", id);
  await updateDoc(docRef, { likes: increment(1) });
};

document.getElementById('mainBtn').onclick = async () => {
  await addDoc(collection(db, "requests"), {
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    likes: 0,
    timestamp: serverTimestamp()
  });
};

/* ======================
   ОТОБРАЖЕНИЕ
====================== */

const q = query(collection(db, "requests"), orderBy("timestamp", "desc"));
onSnapshot(q, (snapshot) => {
  const feed = document.getElementById('feed');
  feed.innerHTML = "";
  snapshot.forEach((docItem) => {
    const data = docItem.data();
    feed.innerHTML += `
    <div class="post">
      <span class="time">${data.timestamp?.toDate().toLocaleTimeString() || '...'}</span>
      <b>${data.name}</b>
      <p>${data.email}</p>
      <button class="like-btn" onclick="processLike('${docItem.id}')">👍 ${data.likes || 0}</button>
    </div>
    `;
  });
});

/* ======================
   ОТЗЫВЫ
====================== */

document.getElementById("reviewBtn").onclick = async () => {
  await addDoc(collection(db, "reviews"), {
    name: document.getElementById("reviewName").value,
    text: document.getElementById("reviewText").value,
    timestamp: serverTimestamp()
  });
};

const reviewQuery = query(collection(db, "reviews"), orderBy("timestamp", "desc"));
onSnapshot(reviewQuery, (snapshot) => {
  const reviewsFeed = document.getElementById("reviewsFeed");
  reviewsFeed.innerHTML = "";
  snapshot.forEach((docItem) => {
    const data = docItem.data();
    reviewsFeed.innerHTML += `
    <div class="post">
      <span class="time">${data.timestamp?.toDate().toLocaleTimeString() || '...'}</span>
      <b>${data.name}</b>
      <p>${data.text}</p>
    </div>
    `;
  });
});
</script>

</body>
</html>
