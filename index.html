<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {
getFirestore, collection, addDoc, query, orderBy, onSnapshot,
serverTimestamp, updateDoc, doc, increment
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

import {
getAuth,
GoogleAuthProvider,
onAuthStateChanged,
signOut,
signInWithRedirect,
getRedirectResult
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

/* ======================
   FIREBASE CONFIG
====================== */

const firebaseConfig = {
apiKey: "ТВОЙ_API_KEY",
authDomain: "ТВОЙ_AUTH_DOMAIN",
projectId: "ТВОЙ_PROJECT_ID",
storageBucket: "ТВОЙ_STORAGE_BUCKET",
messagingSenderId: "ТВОЙ_SENDER_ID",
appId: "ТВОЙ_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

/* ======================
   АВТОРИЗАЦИЯ
====================== */

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const userInfo = document.getElementById("userInfo");
const mainForm = document.getElementById("mainForm");
const reviewForm = document.getElementById("reviewForm");

loginBtn.onclick = async () => {
  try {
    await signInWithRedirect(auth, provider);
  } catch (error) {
    console.error("Ошибка входа:", error);
    alert(error.message);
  }
};

logoutBtn.onclick = async () => {
  try {
    await signOut(auth);
  } catch (error) {
    console.error("Ошибка выхода:", error);
  }
};

/* Проверяем результат редиректа */
getRedirectResult(auth)
  .then((result) => {
    if (result?.user) {
      console.log("Успешный вход:", result.user.displayName);
    }
  })
  .catch((error) => {
    console.error("Ошибка redirect:", error);
  });

onAuthStateChanged(auth, (user) => {
  if (user) {
    userInfo.textContent = "Вы вошли как: " + user.displayName;
    loginBtn.classList.add("hidden");
    logoutBtn.classList.remove("hidden");
    mainForm.classList.remove("hidden");
    reviewForm.classList.remove("hidden");
  } else {
    userInfo.textContent = "Вы не авторизованы";
    loginBtn.classList.remove("hidden");
    logoutBtn.classList.add("hidden");
    mainForm.classList.add("hidden");
    reviewForm.classList.add("hidden");
  }
});

/* ======================
   ОСНОВНЫЕ ЗАПИСИ
====================== */

window.processLike = async (id) => {
  try {
    const docRef = doc(db, "requests", id);
    await updateDoc(docRef, { likes: increment(1) });
  } catch (error) {
    console.error("Ошибка лайка:", error);
  }
};

document.getElementById('mainBtn').onclick = async () => {
  try {
    await addDoc(collection(db, "requests"), {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      likes: 0,
      timestamp: serverTimestamp()
    });
  } catch (error) {
    console.error("Ошибка записи:", error);
    alert(error.message);
  }
};

/* ======================
   ОТОБРАЖЕНИЕ
====================== */

const q = query(collection(db, "requests"), orderBy("timestamp", "desc"));
onSnapshot(q, (snapshot) => {
  const feed = document.getElementById('feed');
  feed.innerHTML = "";
  snapshot.forEach((docItem) => {
    const data = docItem.data();
    feed.innerHTML += `
      <div class="post">
        <span class="time">${data.timestamp?.toDate().toLocaleTimeString() || '...'}</span>
        <b>${data.name}</b>
        <p>${data.email}</p>
        <button class="like-btn" onclick="processLike('${docItem.id}')">👍 ${data.likes || 0}</button>
      </div>
    `;
  });
});

/* ======================
   ОТЗЫВЫ
====================== */

document.getElementById("reviewBtn").onclick = async () => {
  try {
    await addDoc(collection(db, "reviews"), {
      name: document.getElementById("reviewName").value,
      text: document.getElementById("reviewText").value,
      timestamp: serverTimestamp()
    });
  } catch (error) {
    console.error("Ошибка отзыва:", error);
    alert(error.message);
  }
};

const reviewQuery = query(collection(db, "reviews"), orderBy("timestamp", "desc"));
onSnapshot(reviewQuery, (snapshot) => {
  const reviewsFeed = document.getElementById("reviewsFeed");
  reviewsFeed.innerHTML = "";
  snapshot.forEach((docItem) => {
    const data = docItem.data();
    reviewsFeed.innerHTML += `
      <div class="post">
        <span class="time">${data.timestamp?.toDate().toLocaleTimeString() || '...'}</span>
        <b>${data.name}</b>
        <p>${data.text}</p>
      </div>
    `;
  });
});
</script>
